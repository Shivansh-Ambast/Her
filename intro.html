<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background: url('https://source.unsplash.com/1600x900/?desk,coffee,books') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .paper {
            background: white;
            width: 80%;
            max-width: 600px;
            min-height: 300px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.3);
            text-align: left;
            font-size: 20px;
            color: black;
            font-family: 'Georgia', serif;
            line-height: 1.5;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        .next-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .next-button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="paper">
        <h1>📜 Heyy 📜</h1>
        <p id="customMessage">

        </p>
        <button class="next-button" onclick="goToNextPage()">Next ➡️</button>
    </div>

    <script>
        function goToNextPage() {
            window.location.href = "timecapsule.html"; // Change this to your next page's filename

</html>
